<div id="containerPrincipal">
  <div id="haut">
    <h1>Paramétrer les badges</h1>
    <button id="AjoutBadges">
      <fa-icon [icon]="faPlus"></fa-icon> Ajouter un badge
    </button>
  </div>

  <div id="conteneurBadges">
    <div class="badge-card" *ngFor="let badge of badges">
      <div id="enteteBadges">
        <h2>{{ badge.nom }}</h2>
        <fa-icon [icon]="faMedal"
                 [ngClass]="{
                   'iconeBadge': badge.couleur === 'bronze',
                   'iconeBadges': badge.couleur === 'argent',
                   'iconeBadg': badge.couleur === 'or',
                   'iconeBad': badge.couleur === 'diamant'
                 }">
        </fa-icon>
      </div>

      <div id="descriptionBadge">
        <p>{{ badge.objectif }}</p>
      </div>

      <div id="descriptionBadge2">
        <p>{{ badge.description }}</p>
      </div>

      <div id="btns">
        <button class="btnModifier">
          <fa-icon [icon]="faEdit"></fa-icon> Modifier
        </button>
        <button class="btnSupprimer" (click)="supprimerBadge(badge.idBadge)">
          <fa-icon [icon]="faTrash"></fa-icon> Supprimer
        </button>
      </div>
    </div>
  </div>
</div>
