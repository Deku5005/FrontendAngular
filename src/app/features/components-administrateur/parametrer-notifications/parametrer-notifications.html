<div class="notification-container">
  <h1>Paramétrer les Notifications</h1>

  <form [formGroup]="notificationForm" (ngSubmit)="onSubmit()" class="notification-form">
    <div class="form-group">
      <label for="notificationType">Type de Notification</label>
      <select
        id="notificationType"
        formControlName="notificationType"
        [class.invalid]="notificationForm.get('notificationType')?.invalid && notificationForm.get('notificationType')?.touched">
        <option value="">Sélectionnez un type</option>
        <option *ngFor="let type of notificationTypes" [value]="type.value">
          {{ type.label }}
        </option>
      </select>
      <div *ngIf="notificationForm.get('notificationType')?.invalid && notificationForm.get('notificationType')?.touched"
           class="error-message">
        Veuillez sélectionner un type de notification
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        formControlName="description"
        rows="4"
        placeholder="Entrez la description de la notification..."
        [class.invalid]="notificationForm.get('description')?.invalid && notificationForm.get('description')?.touched">
      </textarea>
      <div *ngIf="notificationForm.get('description')?.errors?.['required'] && notificationForm.get('description')?.touched"
           class="error-message">
        La description est requise
      </div>
      <div *ngIf="notificationForm.get('description')?.errors?.['minlength'] && notificationForm.get('description')?.touched"
           class="error-message">
        La description doit contenir au moins 10 caractères
      </div>
    </div>

    <button
      type="submit"
      class="send-button"
      [disabled]="isSubmitting || notificationForm.invalid">
      <span *ngIf="!isSubmitting">Envoyer</span>
      <span *ngIf="isSubmitting">Envoi en cours...</span>
    </button>
  </form>

  <div *ngIf="showSuccess" class="success-message">
     Notification envoyée avec succès !
  </div>
</div>
