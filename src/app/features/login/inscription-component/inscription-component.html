
<body>
<div class="container">
  <div class="image-section">
    <img src="assets/T.png" alt="Image illustrative">
    <div class="image-text">
      <h3>Gagnez des récompenses et montez en compétences !</h3>
    </div>
  </div>

  <div class="form-section">
    <img src="assets/logo.png" id="logo">
    <h2>Collabdev</h2>

    <form>

      <div class="form-group">
        <label for="Nom">Nom</label>
        <input type="text" id="nom" name="nom" placeholder="Entrez votre nom" required>

      <div class="form-group">
        <label for="Prenom">Prenom</label>
        <input type="text" id="prenom" name="nom" placeholder="Entrez votre prenom" required>

      <div class="form-group">
        <label for="Email">Email</label>
        <input type="email" id="email" name="email" placeholder="Entrez votre email" required>

      <div class="form-group">

          <option value="valeur1">Developpeur</option>
          <option value="valeur2">Designer</option>
          <option value="valeur3">AUtres</option>
        </select>

      <div class="form-group">
        <label for="password">Mot de passe</label>

      </div>

      <button type="submit">Se connecter</button>

      <p>Deja un compte?<span><a routerLink="/Connexion">Se connecter </a> </span></p>

  </div>
</div>
