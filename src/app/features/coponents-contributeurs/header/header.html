<header class="header" #header>
  <div class="header-left">
    <button class="menu-toggle">
      <i class="fas fa-bars"></i>
    </button>
  </div>
  <div class="header-right">
    <button class="notif-btn" aria-label="Notifications" #icon>
      <fa-icon [icon]="faBell"></fa-icon>
      <span class="notif-badge">3</span>
    </button>

    <button class="darkmode-btn" aria-label="Mode sombre" #btn>
      <fa-icon [icon]="faMoon"></fa-icon>
    </button>

    <!-- Modifié ici : ajout de routerLink et (click) -->
    <a routerLink="/Connexion" class="btn btn-logout" id="logout-btn" (click)="clearSession()">
      <i class="fas fa-sign-out-alt"></i>
      <span>Se déconnecter</span>
    </a>
  </div>
</header>
