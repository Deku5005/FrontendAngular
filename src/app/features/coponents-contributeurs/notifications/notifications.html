<div id="container">
  <div id="haut">
    <app-search-bar></app-search-bar>
  </div>

  <div id="milieu">
    <div *ngFor="let notif of notifications" id="premier">
      <h2>Collabdev</h2>
      <div id="second">
        <p>Notification: {{ notif.titre }}</p>
        <button id="voir" (click)="ouvrirModal(notif)">
          <fa-icon [icon]="faEye"></fa-icon> Voir
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Ici, on appelle le composant Modal -->
<app-modal-notification
  [notification]="notificationSelectionnee"
  [visible]="modalVisible"
  (close)="fermerModal()">
</app-modal-notification>
