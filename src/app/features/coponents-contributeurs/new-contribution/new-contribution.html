<!-- contribution-modal.component.html -->
<div class="modal">
  <div class="modal-header">
    <h1>Nouvelle Contributions</h1>
    <button class="close-btn" (click)="closeModal()">×</button>
  </div>

  <form class="form" (ngSubmit)="onSubmit()">
    <label for="fonctionnalite">Choisir une fonctionnalité</label>
    <select id="fonctionnalite" required>
      <option value="">Sélectionnez une fonctionnalité</option>
      <option value="feature1">Fonctionnalité 1</option>
      <option value="feature2">Fonctionnalité 2</option>
    </select>

    <label for="contenu">Contenu</label>
    <textarea id="contenu" rows="6" required></textarea>

    <div class="buttons">
      <button type="button" class="upload-btn" (click)="onFileUpload()">
        Téléverser un fichier
      </button>

      <div class="right-buttons">
        <button type="reset" class="cancel-btn">Annuler</button>
        <button type="submit" class="submit-btn">Envoyer</button>
      </div>
    </div>
  </form>
</div>
