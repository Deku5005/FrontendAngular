<div class="modal">
  <!-- En-tête avec bouton de fermeture -->
  <div class="modal-header">
    <h1>{{ contributionData?.title || 'Détails de la contribution' }}</h1>
    <button class="close-btn" (click)="closeModal()">X</button>
  </div>

  <!-- Corps de la modal -->
  <div class="modal-body">
    <!-- Ligne info date et auteur -->
    <div class="info-row">
      <p>La contribution a été faite le <strong>{{ contributionData?.date | date:'dd/MM/yyyy' }}</strong></p>
      <p class="auteur">Statut: <strong>{{ contributionData?.statusText }}</strong></p>
    </div>
    <p class="auteur">Par <strong>{{ contributionData?.auteur }}</strong></p>
    </div>

    <!-- Libellé contenu -->
    <p class="content-label">Contenu</p>

    <!-- Bloc de code -->
    <div class="code-block">
      <p class="fonctionnalite">{{ contributionData?.contenu }}</p>
      <pre><code>{{ codeSnippet }}</code></pre>
    </div>
  </div>
