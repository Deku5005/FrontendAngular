<div class="modal">
  <div class="modal-header">
    <h1>Ajout de Coins</h1>
  </div>

  <form (ngSubmit)="onSubmit()" class="form">
    <div class="form-group">
      <label for="amount">Nombre de Coins</label>
      <input
        type="number"
        id="amount"
        [(ngModel)]="coinsData.amount"
        name="amount"
        required
        placeholder="Entrez le nombre de coins">
    </div>

    <div class="buttons">
      <button type="button" class="cancel-btn" (click)="goBack()">Annuler</button>
      <button type="submit" class="submit-btn">Enregistrer</button>
    </div>
  </form>
</div>
