<div class="fonctionnalites-container">
  <div class="header">
    <h2><i class="fa fa-cogs" aria-hidden="true"></i> Fonctionnalités</h2>
    <p>Découvrez les fonctionnalités de CollabDev</p>
   <button (click)="navigateToContributions()">Contributions</button>
  </div>

  <div class="fonctionnalite-item">
    <table>
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Fonctionnalités</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let feature of features">
          <th scope="row">{{feature.id}}</th>
          <td>{{feature.description}}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
